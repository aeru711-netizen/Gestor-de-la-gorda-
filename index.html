<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Archivos - Mamá</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 10px; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; font-size: 20px; }
        .path { font-size: 13px; background: #eef2f7; padding: 8px; border-radius: 6px; margin-bottom: 10px; word-break: break-all; }
        .btn { background: #3498db; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 14px; width: 100%; margin-top: 5px; }
        .btn-folder { background: #e67e22; }
        .btn-danger { background: #e74c3c; padding: 5px 8px; font-size: 12px; }
        input[type="file"], input[type="text"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        ul { list-style: none; padding: 0; margin-top: 10px; }
        li { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; font-size: 14px; gap: 10px; }
        .file-info { display: flex; align-items: center; gap: 10px; overflow: hidden; max-width: 75%; }
        .file-info img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
        li a { color: #2980b9; text-decoration: none; word-break: break-all; }
        .loading { text-align: center; color: #7f8c8d; font-style: italic; font-size: 13px; margin: 10px 0; }
        .section { background: #fafbfc; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #eaeaea; }
    </style>
</head>
<body>

<div class="container">
    <h2>📁 Gestor de Archivos</h2>
    
    <div class="path" id="currentPath">Ruta: /</div>
    <button class="btn" id="backBtn" style="display:none; background:#7f8c8d; margin-bottom:10px;" onclick="goBack()">⬅️ Volver atrás</button>

    <!-- Crear Carpeta -->
    <div class="section">
        <input type="text" id="folderNameInput" placeholder="Nombre de nueva carpeta...">
        <button class="btn btn-folder" onclick="createFolder()">📂 Crear Carpeta</button>
    </div>

    <!-- Subir Archivo -->
    <div class="section">
        <input type="file" id="fileInput">
        <button class="btn" onclick="uploadFile()">⬆️ Subir Archivo</button>
    </div>

    <p id="status" class="loading"></p>

    <h3>Contenido:</h3>
    <ul id="fileList"></ul>
</div>

<script>
    const SUPABASE_URL = 'sb_publishable_6SOOP42opdGMpUt0n7jTFg_5MZsXLTU';
    const SUPABASE_ANON_KEY = 'sb_secret_67mAJI41UUlz_cdbccs3Xw_3OS1PQPV';
    const BUCKET_NAME = 'archivos-mama';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentFolder = '';

    async function listFiles() {
        const status = document.getElementById('status');
        const fileList = document.getElementById('fileList');
        const pathDiv = document.getElementById('currentPath');
        const backBtn = document.getElementById('backBtn');
        
        status.innerText = "Cargando...";
        fileList.innerHTML = "";
        pathDiv.innerText = "Ruta: /" + currentFolder;

        backBtn.style.display = currentFolder !== '' ? 'block' : 'none';

        const { data, error } = await supabaseClient.storage.from(BUCKET_NAME).list(currentFolder, {
            sortBy: { column: 'name', order: 'asc' }
        });

        if (error) {
            status.innerText = "Error al cargar: " + error.message;
            return;
        }

        status.innerText = "";

        if (!data || data.length === 0) {
            fileList.innerHTML = "<li style='justify-content:center; color:#95a5a6;'>Carpeta vacía</li>";
            return;
        }

        data.forEach(item => {
            if (item.name === '.emptyFolderPlaceholder' || item.name === '.keep') return;

            const li = document.createElement('li');
            const isFolder = item.id === null; // En Supabase los objetos sin ID estructurado o tamaño suelen ser carpetas

            if (isFolder) {
                li.innerHTML = `
                    <div class="file-info" style="cursor:pointer; font-weight:bold; color:#e67e22;" onclick="openFolder('${item.name}')">
                        📁 ${item.name}/
                    </div>
                    <button class="btn btn-danger" onclick="deleteItem('${item.name}', true)">Borrar</button>
                `;
            } else {
                const filePath = currentFolder ? `${currentFolder}/${item.name}` : item.name;
                const { data: publicUrlData } = supabaseClient.storage.from(BUCKET_NAME).getPublicUrl(filePath);
                const fileUrl = publicUrlData.publicUrl;

                const isImage = /\.(jpg|jpeg|png|gif|webp)$/i.test(item.name);
                
                li.innerHTML = `
                    <div class="file-info">
                        ${isImage ? `<img src="${fileUrl}" alt="img">` : '📄'}
                        <a href="${fileUrl}" target="_blank">${item.name}</a>
                    </div>
                    <button class="btn btn-danger" onclick="deleteItem('${item.name}', false)">Borrar</button>
                `;
            }
            fileList.appendChild(li);
        });
    }

    async function uploadFile() {
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');

        if (fileInput.files.length === 0) {
            alert("Selecciona un archivo primero.");
            return;
        }

        const file = fileInput.files[0];
        const filePath = currentFolder ? `${currentFolder}/${file.name}` : file.name;

        status.innerText = "Subiendo archivo...";

        const { error } = await supabaseClient.storage.from(BUCKET_NAME).upload(filePath, file, {
            upsert: true
        });

        if (error) {
            status.innerText = "Error al subir: " + error.message;
        } else {
            status.innerText = "¡Subido con éxito!";
            fileInput.value = "";
            listFiles();
        }
    }

    async function createFolder() {
        const folderInput = document.getElementById('folderNameInput');
        const folderName = folderInput.value.trim().replace(/\//g, '');
        const status = document.getElementById('status');

        if (!folderName) {
            alert("Escribe un nombre válido para la carpeta.");
            return;
        }

        // Supabase requiere un archivo centinela (.keep) dentro de una ruta para que se reconozca la carpeta
        const folderPath = currentFolder ? `${currentFolder}/${folderName}/.keep` : `${folderName}/.keep`;
        const emptyFile = new Blob([''], { type: 'text/plain' });

        status.innerText = "Creando carpeta...";

        const { error } = await supabaseClient.storage.from(BUCKET_NAME).upload(folderPath, emptyFile);

        if (error) {
            status.innerText = "Error al crear carpeta: " + error.message;
        } else {
            status.innerText = "¡Carpeta creada!";
            folderInput.value = "";
            listFiles();
        }
    }

    function openFolder(folderName) {
        currentFolder = currentFolder ? `${currentFolder}/${folderName}` : folderName;
        listFiles();
    }

    function goBack() {
        const parts = currentFolder.split('/');
        parts.pop();
        currentFolder = parts.join('/');
        listFiles();
    }

    async function deleteItem(itemName, isFolder) {
        if (!confirm(`¿Eliminar "${itemName}"?`)) return;

        const status = document.getElementById('status');
        status.innerText = "Eliminando...";

        let pathsToDelete = [];
        if (isFolder) {
            // Si es carpeta, borramos el archivo interno .keep
            const folderPath = currentFolder ? `${currentFolder}/${itemName}/.keep` : `${itemName}/.keep`;
            pathsToDelete.push(folderPath);
        } else {
            const filePath = currentFolder ? `${currentFolder}/${itemName}` : itemName;
            pathsToDelete.push(filePath);
        }

        const { error } = await supabaseClient.storage.from(BUCKET_NAME).remove(pathsToDelete);

        if (error) {
            status.innerText = "Error al eliminar: " + error.message;
        } else {
            status.innerText = "Eliminado correctamente.";
            listFiles();
        }
    }

    listFiles();
</script>

</body>
</html>
